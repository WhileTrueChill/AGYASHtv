name: Restore AGYASH hero
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original root page and add exact hero image
        run: |
          curl -fsSL 'https://raw.githubusercontent.com/WhileTrueChill/AGYASHtv/d358de0769fdaca7c0eae597a51673a65b533072/index.html' -o index.html
          mkdir -p assets
          curl -fL 'https://www.shortlist.com/news/netflix-is-making-big-changes-to-how-it-recommends-movies-and-shows-404210' -o assets/agyash-bg.jpg
          file assets/agyash-bg.jpg
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          pattern=r"  \.hero \{\n    padding: 130px 24px 60px;\n    text-align: center;\n    position: relative; overflow: hidden;\n  \}\n  \.hero::before \{.*?\n  \}"
          replacement="""  .hero {
            padding: 130px 24px 60px;
            text-align: center;
            position: relative; overflow: hidden;
            isolation: isolate;
            min-height: 720px;
          }
          .hero::before {
            content: '';
            position: absolute; inset: 64px 0 0;
            z-index: -2;
            background-image:
              linear-gradient(to bottom, rgba(10,10,20,.18) 0%, rgba(10,10,20,.40) 34%, rgba(10,10,20,.70) 68%, #0a0a14 100%),
              url('/assets/agyash-bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: saturate(.92) contrast(1.04);
            opacity: .95;
            transform: scale(1.02);
            pointer-events: none;
          }
          .hero::after {
            content: '';
            position: absolute; inset: 64px 0 0;
            z-index: -1;
            background:
              radial-gradient(circle at center, rgba(124,58,237,.14), transparent 52%),
              linear-gradient(90deg, rgba(10,10,20,.52), transparent 22%, transparent 78%, rgba(10,10,20,.52));
            pointer-events: none;
          }
          .hero > * { position: relative; z-index: 1; }"""
          ns,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n != 1: raise SystemExit('hero CSS not found')
          p.write_text(ns,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/agyash-bg.jpg
          git diff --cached --quiet && exit 0
          git commit -m 'Apply exact uploaded hero background [skip ci]'
          git push
