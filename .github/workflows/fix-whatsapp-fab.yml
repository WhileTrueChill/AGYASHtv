name: Fix AGYASH WhatsApp FAB
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set WhatsApp links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Make every WhatsApp floating/contact link use the requested number.
          s=s.replace('https://wa.me/919999999999', 'https://wa.me/918873945359')
          s=s.replace('tel:+919999999999', 'tel:+918873945359')
          s=s.replace('+91 99999 99999', '+91 88739 45359')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix WhatsApp floating button [skip ci]'
          git push
