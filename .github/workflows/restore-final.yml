name: Restore AGYASH TV final
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore and apply fixes
        run: |
          curl -fsSL 'https://raw.githubusercontent.com/WhileTrueChill/AGYASHtv/d358de0769fdaca7c0eae597a51673a65b533072/index.html' -o index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          pattern=r"  \.hero \{\n    padding: 130px 24px 60px;\n    text-align: center;\n    position: relative; overflow: hidden;\n  \}\n  \.hero::before \{.*?\n  \}"
          replacement="""  .hero {
    padding: 130px 24px 60px;
    text-align: center;
    position: relative; overflow: hidden;
    isolation: isolate;
    min-height: 720px;
  }
  .hero::before {
    content: '';
    position: absolute; inset: 64px 0 0;
    z-index: -2;
    background-image:
      linear-gradient(to bottom, rgba(10,10,20,.18) 0%, rgba(10,10,20,.40) 34%, rgba(10,10,20,.70) 68%, #0a0a14 100%),
      url('/assets/agyash-bg.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    filter: saturate(.92) contrast(1.04);
    opacity: .95;
    transform: scale(1.02);
    pointer-events: none;
  }"""
          s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n != 1: raise SystemExit('hero block not found')
          wa='https://wa.me/919507670255?text=Hi%20AGYASH%20TV%2C%20I%20want%20to%20know%20more.'
          s=s.replace('<a class="nav-logo" href="#">AGYASH<span> TV</span></a>', '<a class="nav-logo" href="'+wa+'" target="_blank" rel="noopener">AGYASH<span> TV</span></a>')
          old="""function handlePlanPurchase(plan, price) {
  // Opens plan purchase page at your Vercel server
  window.open(`${SERVER_URL}/purchase?plan=${encodeURIComponent(plan)}&price=${price}`, '_blank');
}"""
          new="""function handlePlanPurchase(plan, price) {
  const msg = `Hi AGYASH TV, I want to know about the ${plan} plan (₹${price}).`;
  window.open(`https://wa.me/919507670255?text=${encodeURIComponent(msg)}`, '_blank');
}"""
          if old not in s: raise SystemExit('plan handler not found')
          s=s.replace(old,new,1)
          s=s.replace('https://wa.me/919999999999','https://wa.me/919507670255')
          s=s.replace('tel:+919999999999','tel:+919507670255')
          s=s.replace('+91 99999 99999','+91 95076 70255')
          s=s.replace('https://wa.me/918873945359','https://wa.me/919507670255')
          s=s.replace('tel:+918873945359','tel:+919507670255')
          s=s.replace('+91 88739 45359','+91 95076 70255')
          s=s.replace('© 2025 AGYASH TV. All rights reserved.','© 2026 AGYASH TV. All rights reserved.')

          plan_css="""  /* ─── PLANS ─── */
  .plan-card {
    background: linear-gradient(145deg, rgba(19,19,42,.96), rgba(10,10,20,.96));
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 26px;
    position: relative;
    overflow: hidden;
    min-height: 285px;
    display: flex;
    flex-direction: column;
    transition: transform .25s, box-shadow .25s, border-color .25s;
  }
  .plan-card::before { content:''; position:absolute; inset:0; background:radial-gradient(circle at 85% 15%, rgba(124,58,237,.16), transparent 42%); pointer-events:none; }
  .plan-card:hover { transform:translateY(-5px); border-color:var(--accent); box-shadow:0 14px 40px rgba(0,0,0,.42),0 0 24px var(--accent-glow); }
  .plan-card:nth-child(2) { border-color:rgba(6,182,212,.55); background:linear-gradient(145deg,rgba(12,27,48,.96),rgba(10,10,20,.96)); }
  .plan-card:nth-child(3) { border-color:rgba(16,185,129,.42); background:linear-gradient(145deg,rgba(8,31,31,.96),rgba(10,10,20,.96)); }
  .plan-name { position:relative; z-index:1; font-size:1.15rem; font-weight:800; margin-bottom:12px; }
  .plan-price { position:relative; z-index:1; font-size:2.5rem; font-weight:900; letter-spacing:-1px; margin-bottom:7px; }
  .plan-price sup { font-size:1.1rem; vertical-align:top; margin-right:2px; }
  .plan-period { position:relative; z-index:1; color:var(--text-secondary); font-size:.82rem; margin-bottom:20px; }
  .btn-plan { position:relative; z-index:1; width:100%; margin-top:auto; min-height:48px; padding:12px 18px; border:0; border-radius:12px; font-family:'Inter',sans-serif; font-size:.92rem; font-weight:800; color:#fff; cursor:pointer; background:linear-gradient(135deg,var(--accent),#a855f7); box-shadow:0 7px 22px rgba(124,58,237,.28); transition:transform .2s,opacity .2s,box-shadow .2s; }
  .plan-card:nth-child(2) .btn-plan { background:linear-gradient(135deg,#0891b2,#2563eb); box-shadow:0 7px 22px rgba(6,182,212,.25); }
  .plan-card:nth-child(3) .btn-plan { background:linear-gradient(135deg,#10b981,#22c55e); box-shadow:0 7px 22px rgba(16,185,129,.25); }
  .btn-plan:hover { transform:translateY(-2px); opacity:.92; box-shadow:0 10px 28px rgba(124,58,237,.38); }
  @media (max-width:560px) {
    #plans .cards-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    #plans .plan-card { padding:20px; min-height:245px; }
    #plans .plan-name { font-size:1rem; }
    #plans .plan-price { font-size:2rem; }
    #plans .plan-period { font-size:.74rem; }
    #plans .btn-plan { min-height:44px; padding:10px 8px; font-size:.78rem; }
    #plans .plan-card:nth-child(3) { grid-column:1 / -1; max-width:calc(50% - 7px); }
  }
"""
          marker='          s=s.replace(\'© 2025 AGYASH TV. All rights reserved.\',\'© 2026 AGYASH TV. All rights reserved.\')'
          if marker not in s: raise SystemExit('marker missing')
          s=s.replace(marker, marker+"\n          if '/* ─── PLANS ─── */' not in s:\n              s=s.replace('  .contact-grid {', plan_css+'\\n  .contact-grid {', 1)",1)

          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Restore full page and apply WhatsApp 2026 fixes [skip ci]'
          git push
